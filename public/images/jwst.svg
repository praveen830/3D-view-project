<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="jwBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="goldHex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#jwBg)"/>
  <circle cx="18" cy="18" r="0.8" fill="#fff" opacity="0.9"/>
  <circle cx="102" cy="22" r="0.7" fill="#fff" opacity="0.8"/>
  <circle cx="95" cy="100" r="0.8" fill="#fff" opacity="0.7"/>
  <!-- Sunshield Kite Shape -->
  <polygon points="60,28 108,62 60,96 12,62" fill="url(#shieldGrad)" stroke="#e2e8f0" stroke-width="1"/>
  <polygon points="60,32 104,62 60,92 16,62" fill="none" stroke="#f59e0b" stroke-width="0.7" opacity="0.6"/>
  <!-- Central Primary Mirror (Gold Hexagonal Array) -->
  <polygon points="60,42 74,50 74,66 60,74 46,66 46,50" fill="url(#goldHex)" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="60" cy="58" r="3.2" fill="#090d16"/>
  <!-- Secondary Mirror Boom Struts -->
  <line x1="60" y1="58" x2="60" y2="38" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="60" cy="38" r="2" fill="#e2e8f0"/>
</svg>
