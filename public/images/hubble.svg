<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="hSpaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="hSolar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#hSpaceBg)"/>
  <circle cx="15" cy="20" r="0.8" fill="#fff" opacity="0.8"/>
  <circle cx="108" cy="80" r="0.7" fill="#fff" opacity="0.8"/>
  <!-- Hubble Main Body (Silver Cylinder) -->
  <rect x="52" y="30" width="16" height="58" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <!-- Front Aperture & Door -->
  <ellipse cx="60" cy="30" rx="8" ry="3" fill="#0f172a"/>
  <line x1="52" y1="30" x2="44" y2="20" stroke="#94a3b8" stroke-width="2"/>
  <!-- Solar Wings (Side Arrays) -->
  <line x1="22" y1="60" x2="52" y2="60" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="12" y="44" width="26" height="32" rx="2" fill="url(#hSolar)" stroke="#0284c7" stroke-width="1"/>
  <line x1="68" y1="60" x2="98" y2="60" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="82" y="44" width="26" height="32" rx="2" fill="url(#hSolar)" stroke="#0284c7" stroke-width="1"/>
  <!-- Antennas -->
  <line x1="60" y1="88" x2="60" y2="102" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="60" cy="103" r="2.5" fill="#38bdf8"/>
</svg>
