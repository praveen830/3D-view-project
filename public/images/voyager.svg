<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="vBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="vDish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <radialGradient id="vGoldRecord" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#vBg)"/>
  <circle cx="20" cy="18" r="0.8" fill="#fff" opacity="0.9"/>
  <circle cx="104" cy="95" r="0.7" fill="#fff" opacity="0.8"/>
  <!-- High Gain Antenna Dish (White 3.7m Parabola) -->
  <ellipse cx="60" cy="46" rx="34" ry="22" fill="url(#vDish)" stroke="#94a3b8" stroke-width="1"/>
  <ellipse cx="60" cy="46" rx="4" ry="2.5" fill="#334155"/>
  <!-- Sub-reflector Tripod -->
  <line x1="60" y1="46" x2="60" y2="28" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="60" cy="27" r="2.5" fill="#e2e8f0"/>
  <!-- Equipment Bus -->
  <rect x="48" y="66" width="24" height="14" rx="2" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <!-- Golden Record -->
  <circle cx="54" cy="73" r="5" fill="url(#vGoldRecord)" stroke="#ca8a04" stroke-width="0.8"/>
  <circle cx="54" cy="73" r="1.2" fill="#000"/>
  <!-- Magnetometer & RTG Booms -->
  <line x1="72" y1="72" x2="108" y2="82" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="100" y="78" width="8" height="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="0.6"/>
  <line x1="48" y1="72" x2="18" y2="88" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- RTG Power Cylinders -->
  <rect x="12" y="84" width="10" height="7" rx="1" fill="#475569"/>
</svg>
