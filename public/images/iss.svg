<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="solarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#spaceBg)"/>
  <circle cx="20" cy="25" r="0.8" fill="#fff" opacity="0.8"/>
  <circle cx="105" cy="18" r="0.6" fill="#fff" opacity="0.7"/>
  <circle cx="85" cy="100" r="0.9" fill="#fff" opacity="0.9"/>
  <!-- Central Truss -->
  <rect x="15" y="58" width="90" height="4" rx="2" fill="#94a3b8"/>
  <!-- Modules -->
  <rect x="52" y="45" width="16" height="30" rx="3" fill="#e2e8f0"/>
  <rect x="44" y="54" width="32" height="12" rx="2" fill="#cbd5e1"/>
  <!-- Solar Arrays Left -->
  <rect x="20" y="24" width="12" height="30" rx="1" fill="url(#solarGold)" stroke="#d97706" stroke-width="0.5"/>
  <rect x="20" y="66" width="12" height="30" rx="1" fill="url(#solarGold)" stroke="#d97706" stroke-width="0.5"/>
  <rect x="34" y="24" width="12" height="30" rx="1" fill="url(#solarGold)" stroke="#d97706" stroke-width="0.5"/>
  <rect x="34" y="66" width="12" height="30" rx="1" fill="url(#solarGold)" stroke="#d97706" stroke-width="0.5"/>
  <!-- Solar Arrays Right -->
  <rect x="74" y="24" width="12" height="30" rx="1" fill="url(#solarGold)" stroke="#d97706" stroke-width="0.5"/>
  <rect x="74" y="66" width="12" height="30" rx="1" fill="url(#solarGold)" stroke="#d97706" stroke-width="0.5"/>
  <rect x="88" y="24" width="12" height="30" rx="1" fill="url(#solarGold)" stroke="#d97706" stroke-width="0.5"/>
  <rect x="88" y="66" width="12" height="30" rx="1" fill="url(#solarGold)" stroke="#d97706" stroke-width="0.5"/>
  <!-- Radiators -->
  <rect x="50" y="32" width="6" height="18" fill="#ffffff" opacity="0.9"/>
  <rect x="64" y="32" width="6" height="18" fill="#ffffff" opacity="0.9"/>
  <!-- Earth Limb Glow below -->
  <path d="M 0 110 Q 60 95 120 110 L 120 120 L 0 120 Z" fill="#0284c7" opacity="0.4"/>
